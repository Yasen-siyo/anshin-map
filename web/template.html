<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- 페이지가 불러올 수 있는 곳을 지도 타일·검색 서버로만 묶는다. 인라인 스크립트는 build_page.py 가 넣는 해시로만 허용 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://cdnjs.cloudflare.com '/*SCRIPT_HASH*/'; style-src https://cdnjs.cloudflare.com 'unsafe-inline'; img-src data: https://cdnjs.cloudflare.com https://cyberjapandata.gsi.go.jp https://tile.openstreetmap.org https://server.arcgisonline.com; connect-src https://nominatim.openstreetmap.org https://msearch.gsi.go.jp; base-uri 'none'; form-action 'none'">
<title>숙박 안심도 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* 레이아웃: 화면 전체 지도 + 왼쪽 위 떠 있는 조작 패널 */
:root {
  --bg: #f6f7f5; --panel: #ffffffee; --fg: #1d2420; --muted: #5d6a63; --line: #d5dbd6; --accent: #1f6f5c;
  --input-bg: #ffffff; --safe: #2ea043; --warn: #facc15; --risk: #b91c1c;
  --font: "Noto Sans KR", "Noto Sans JP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121614; --panel: #1b211eee; --fg: #e6ece8; --muted: #9aa8a0; --line: #33403a; --accent: #5fc4a8; --input-bg: #0f1311; color-scheme: dark; }
}
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); }
#map { position: absolute; inset: 0; }
.panel { position: absolute; z-index: 1000; top: 12px; left: 56px; width: min(320px, calc(100vw - 72px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 10px; backdrop-filter: blur(6px); }
.panel h1 { font-size: 15px; margin: 0; }
.regions button { padding: 3px 9px; font-size: 13px; }
.regions button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.row input[type=text] { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--input-bg); color: var(--fg);
  -webkit-text-fill-color: var(--fg); caret-color: var(--fg); font: inherit; font-size: 16px; }
button { padding: 6px 10px; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; cursor: pointer; }
button.ghost { background: transparent; color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font-size: 11px; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }
.score { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
.score b { font-size: 28px; }
.legend { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--safe), var(--warn), #ea580c, var(--risk)); }
.legend-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.cats { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; font-size: 12px; }
.cats label { display: flex; gap: 4px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.hint { font-size: 11px; color: var(--muted); }
details summary { cursor: pointer; font-size: 12px; color: var(--muted); }
.panel.folded > :not(:first-child):not(.keep) { display: none; }
#scoreBtn { display: none; }
.panel.folded #scoreBtn { display: inline-block; }
#scoreBtn[aria-pressed="true"] { background: var(--accent); color: #fff; }
@media (max-width: 600px) {
  /* 휴대폰에서는 오른쪽 위 레이어 버튼과 겹치지 않게 패널을 화면 아래로 내린다 */
  .panel { top: auto; left: calc(8px + env(safe-area-inset-left)); right: calc(8px + env(safe-area-inset-right));
    bottom: calc(var(--attr-h, 40px) + 6px + env(safe-area-inset-bottom)); width: auto;
    max-height: 60vh; max-height: calc(100dvh - var(--attr-h, 40px) - 90px); overflow-y: auto; padding: 10px; gap: 8px; }
  .score b { font-size: 22px; }
  /* 출처 표기는 패널 아래 한 줄 폭에 맞춰 작게. 줄 수가 바뀌어도 패널은 스크립트가 잰 높이(--attr-h)만큼 위로 뜬다 */
  .leaflet-control-attribution { font-size: 10px; line-height: 1.3; padding-bottom: env(safe-area-inset-bottom); }
}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel" id="panel">
  <div class="row" style="justify-content:space-between"><h1>숙박 안심도 지도</h1>
    <span class="row"><button class="ghost" id="scoreBtn" aria-pressed="false" aria-controls="scorebox">점수</button><button class="ghost" id="fold" aria-expanded="true">접기</button></span></div>
  <div class="row regions" id="regions" role="group" aria-label="지역"></div>
  <div class="row">
    <input type="text" id="q" placeholder="신주쿠, 난바, 나카스, 또는 35.69, 139.70">
    <button id="go">찾기</button>
  </div>
  <div id="scorebox">
    <div class="label">커서 위치 안심도</div>
    <div class="score"><b id="sv">–</b><span id="sl" class="hint">지도 위에 마우스를 올리거나 탭하세요</span></div>
    <div class="legend"></div>
    <div class="legend-l"><span>안심 100</span><span>주의</span><span>0 위험</span></div>
  </div>
  <div class="row">
    <span class="label">히트맵 투명도</span>
    <input type="range" id="op" min="0" max="100" value="65" style="flex:1">
  </div>
  <div class="row">
    <span class="hint">줌 <b id="zv"></b> (구글맵과 같은 단계)</span>
    <button class="ghost" id="gm">구글맵에서 같은 위치 열기</button>
  </div>
  <div class="cats">
    <label><input type="checkbox" id="cv-edge" checked><span class="dot" style="background:#0f3c78"></span>데이터 범위 경계선</label>
    <label><input type="checkbox" id="cv-none" checked><span class="dot" style="background:repeating-linear-gradient(45deg,#464650 0 2px,#c8c8d0 2px 4px)"></span>범죄 자료 없는 곳</label>
  </div>
  <details>
    <summary>시설 표시 (줌 14 이상)</summary>
    <div class="cats" id="cats"></div>
  </details>
  <div class="hint" id="results"></div>
  <div class="hint" id="info"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// 시설 이름·검색 결과 지명은 누구나 고칠 수 있는 OSM 데이터라 HTML 로 넣기 전에 이스케이프한다
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
// 지역마다 따로 만든 히트맵·점수표·범위 이미지와 시설 점 (build_page.py 가 채움)
const REGIONS = /*REGIONS*/null;

const CAT = {
  stripclub: ["스트립클럽", "#7e22ce"], brothel: ["성매매 업소", "#7e22ce"], nightclub: ["나이트클럽", "#db2777"],
  pachinko: ["파칭코·슬롯", "#ea580c"], gambling: ["오락실·도박", "#f59e0b"], adult_shop: ["성인용품점", "#be185d"],
  love_hotel: ["러브호텔", "#e11d48"], bar: ["바", "#2563eb"], hookah: ["물담배", "#0891b2"],
};

let startRegion = REGIONS[0];
try { startRegion = REGIONS.find(r => r.meta.id === localStorage.getItem("region")) || startRegion; } catch (e) {}
const map = L.map("map", { zoomControl: true }).setView(startRegion.meta.center, startRegion.meta.zoom);
// 히트맵에 쓴 데이터의 출처 표기 (OSM 은 ODbL 상 표기 의무)
const crimeSrc = [...new Set(REGIONS.flatMap(r => r.meta.crime_src ? r.meta.crime_src.split(" · ") : []))].join("·");
map.attributionControl.addAttribution('시설 데이터 &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a> (ODbL) · 범죄: ' + esc(crimeSrc) + ' · 경계: e-Stat');
const gsi = L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {
  maxZoom: 18, attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>' });
const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" });
// 영어 지명 지도 (Esri). 일본어 지도가 보기 어려워 기본으로 사용
const esri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19, attribution: "Tiles &copy; Esri" });
const esriGray = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 16, attribution: "Tiles &copy; Esri" });
const esriGrayLabel = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 16 });
const gray = L.layerGroup([esriGray, esriGrayLabel]);
esri.addTo(map);

const heats = REGIONS.map(r => L.imageOverlay(r.heat, r.meta.bounds, { opacity: 0.65, interactive: false, className: "heat" }));
const heat = L.layerGroup(heats).addTo(map);
L.control.layers({ "영어 도로 지도 (Esri)": esri, "영어 연회색 지도 (Esri, 줌 16까지)": gray, "일본어 연한 지도 (국토지리원)": gsi, "OpenStreetMap (일본어)": osm }, { "안심도 히트맵": heat }).addTo(map);
// 데이터 범위: 경계선과 빗금을 각각 켜고 끌 수 있게 같은 이미지를 두 장 겹친다
// (빗금 이미지는 CSS 로 경계선 색만, 경계선 이미지는 빗금만 숨길 수 없어 캔버스로 나눈다)
const coverEdge = L.layerGroup(), coverNone = L.layerGroup();
for (const r of REGIONS) {
  const edge = L.imageOverlay(r.cover, r.meta.bounds, { interactive: false, opacity: 1 }).addTo(coverEdge);
  const none = L.imageOverlay(r.cover, r.meta.bounds, { interactive: false, opacity: 1 }).addTo(coverNone);
  const im = new Image();
  im.onload = () => {
    const mk = keep => {
      const c = document.createElement("canvas"); c.width = im.width; c.height = im.height;
      const x = c.getContext("2d"); x.drawImage(im, 0, 0);
      const d = x.getImageData(0, 0, c.width, c.height), a = d.data;
      for (let i = 0; i < a.length; i += 4) if ((a[i + 3] === 255 && a[i + 2] === 120) !== keep) a[i + 3] = 0;
      x.putImageData(d, 0, 0); return c.toDataURL();
    };
    edge.setUrl(mk(true)); none.setUrl(mk(false));
  };
  im.src = r.cover;
}
syncCover();
function syncCover() {
  document.getElementById("cv-edge").checked ? coverEdge.addTo(map) : coverEdge.remove();
  document.getElementById("cv-none").checked ? coverNone.addTo(map) : coverNone.remove();
}
document.getElementById("cv-edge").onchange = syncCover;
document.getElementById("cv-none").onchange = syncCover;
document.getElementById("op").oninput = e => heats.forEach(h => h.setOpacity(e.target.value / 100));

// 점수 조회용: 안심도 PNG(회색조)를 캔버스로 읽어 픽셀값을 가져온다
for (const r of REGIONS) {
  r.grid = null;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
    const ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0);
    r.grid = ctx.getImageData(0, 0, c.width, c.height).data;
  };
  img.src = r.anshin;
}
const inRegion = (r, lat, lng) => {
  const [[s, w], [n, e]] = r.meta.bounds;
  return lat >= s && lat <= n && lng >= w && lng <= e;
};
const regionAt = (lat, lng) => REGIONS.find(r => inRegion(r, lat, lng));
const inArea = (lat, lng) => !!regionAt(lat, lng);
const y = lat => Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
function scoreAt(ll) {
  const r = regionAt(ll.lat, ll.lng);
  if (!r || !r.grid) return null;
  const M = r.meta, [[south, west], [north, east]] = M.bounds;
  const j = Math.floor((ll.lng - west) / (east - west) * M.nx);
  const i = Math.floor((y(north) - y(ll.lat)) / (y(north) - y(south)) * M.ny);
  if (i < 0 || j < 0 || i >= M.ny || j >= M.nx) return null;
  const k = (i * M.nx + j) * 4;
  return { v: r.grid[k], code: r.grid[k + 1] };
}
function label(v) { return v >= 80 ? "안심" : v >= 60 ? "보통" : v >= 40 ? "주의" : "위험"; }
// PC 는 마우스를 올리면, 폰은 탭하면 점수를 보여준다
const showScore = ev => {
  const r = scoreAt(ev.latlng);
  const ok = r && r.code > 0;
  document.getElementById("sv").textContent = ok ? r.v : "–";
  document.getElementById("sl").textContent = !ok ? "데이터 없음" : label(r.v) + (r.code === 2 ? " (범죄 자료 없음, 시설만)" : "");
};
map.on("mousemove", showScore);
map.on("click", showScore);

// 시설 점: 줌 14 이상에서만
const groups = {};
const catsEl = document.getElementById("cats");
for (const [k, [name, color]] of Object.entries(CAT)) {
  groups[k] = L.layerGroup();
  const count = REGIONS.reduce((n, r) => n + ((r.meta.poi_counts || {})[k] || 0), 0);
  catsEl.insertAdjacentHTML("beforeend",
    `<label><input type="checkbox" id="c-${k}" checked><span class="dot" style="background:${color}"></span>${name} ${count}</label>`);
}
for (const f of REGIONS.flatMap(r => r.poi.features)) {
  const [lng, lat] = f.geometry.coordinates, k = f.properties.c;
  L.circleMarker([lat, lng], { radius: 5, color: CAT[k][1], weight: 1, fillOpacity: .8 })
    .bindTooltip(`${CAT[k][0]}${f.properties.n ? " · " + esc(f.properties.n) : ""}`).addTo(groups[k]);
}
function syncPoi() {
  for (const k in groups) {
    const on = map.getZoom() >= 14 && document.getElementById("c-" + k).checked;
    on ? groups[k].addTo(map) : groups[k].remove();
  }
  document.getElementById("zv").textContent = map.getZoom();
}
catsEl.onchange = syncPoi; map.on("zoomend", syncPoi); syncPoi();

// 검색: 좌표 직접 입력 → OpenStreetMap(Nominatim, 한국어·영어·일본어 지명) → 국토지리원 주소 검색.
// 지도의 지역(도쿄권·오사카·후쿠오카) 안의 결과만 쓴다. 지금 보고 있는 지역을 먼저 찾고, 없으면 전체에서 찾는다.
let pin = null;
const resEl = document.getElementById("results");
async function nominatim(q, r) {
  const box = r ? `&bounded=1&viewbox=${r.meta.bounds[0][1]},${r.meta.bounds[1][0]},${r.meta.bounds[1][1]},${r.meta.bounds[0][0]}` : "";
  const u = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=${r ? 6 : 10}&countrycodes=jp${box}` +
    "&accept-language=ko,en,ja&q=" + encodeURIComponent(q);
  const js = await (await fetch(u)).json();
  return js.map(r => ({ lat: +r.lat, lng: +r.lon, name: r.display_name.split(",").slice(0, 3).join(",") }));
}
async function gsiSearch(q) {
  const js = await (await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q=" + encodeURIComponent(q))).json();
  return js.map(r => ({ lat: r.geometry.coordinates[1], lng: r.geometry.coordinates[0], name: r.properties.title }));
}
function goTo(ll, name) {
  pin && pin.remove();
  const r = scoreAt(ll), ok = r && r.code > 0;
  pin = L.marker(ll).addTo(map).bindPopup((name ? `${esc(name)}<br>` : "") + (ok
    ? `안심도 <b>${r.v}</b> ${label(r.v)}${r.code === 2 ? "<br>범죄 자료 없음 (시설만 반영)" : ""}`
    : "이 위치는 데이터 없음")).openPopup();
  map.setView(ll, 16);
}
async function search() {
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  resEl.textContent = "찾는 중…";
  const m = q.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
  if (m) { resEl.textContent = ""; goTo(L.latLng(+m[1], +m[2])); return; }
  let hits = [];
  const here = map.getCenter(), cur = regionAt(here.lat, here.lng);
  if (cur) { try { hits = await nominatim(q, cur); } catch (_) {} }
  if (!hits.length) { try { hits = (await nominatim(q)).filter(h => inArea(h.lat, h.lng)); } catch (_) {} }
  if (!hits.length) { try { hits = (await gsiSearch(q)).filter(h => inArea(h.lat, h.lng)); } catch (_) {} }
  if (!hits.length) { resEl.textContent = "찾지 못했어요. 역·동네 이름(한국어·영어·일본어)이나 구글맵에서 복사한 좌표를 넣어보세요."; return; }
  goTo(L.latLng(hits[0].lat, hits[0].lng), hits[0].name);
  // 후보가 여러 개면 목록으로 보여줘서 다른 곳을 고를 수 있게
  resEl.innerHTML = hits.length > 1 ? "다른 후보: " : "";
  hits.slice(1).forEach(h => {
    const a = document.createElement("a");
    a.href = "#"; a.textContent = h.name; a.style.display = "block";
    a.onclick = ev => { ev.preventDefault(); goTo(L.latLng(h.lat, h.lng), h.name); };
    resEl.appendChild(a);
  });
}
document.getElementById("go").onclick = search;
document.getElementById("fold").onclick = ev => {
  const f = document.getElementById("panel").classList.toggle("folded");
  ev.target.textContent = f ? "펼치기" : "접기";
  ev.target.setAttribute("aria-expanded", String(!f));
};
// 접은 상태에서도 점수 칸만 따로 켜고 끌 수 있다 (휴대폰에서 지도를 넓게 보면서 점수 확인)
const scoreBtn = document.getElementById("scoreBtn");
const setScoreOnly = on => {
  document.getElementById("scorebox").classList.toggle("keep", on);
  scoreBtn.setAttribute("aria-pressed", String(on));
  try { localStorage.setItem("scoreOnly", on ? "1" : "0"); } catch (e) {}
};
scoreBtn.onclick = () => setScoreOnly(scoreBtn.getAttribute("aria-pressed") !== "true");
let scoreOnly = true;
try { scoreOnly = localStorage.getItem("scoreOnly") !== "0"; } catch (e) {}
setScoreOnly(scoreOnly);
if (window.innerWidth < 600) document.getElementById("fold").click();
// 휴대폰에서 출처 표기 줄이 패널 밑에 깔리지 않게, 표기 높이를 재서 패널을 그 위로 올린다
(() => {
  const attr = document.querySelector(".leaflet-control-attribution");
  if (!attr) return;
  const sync = () => document.documentElement.style.setProperty("--attr-h", attr.offsetHeight + "px");
  sync();
  if (window.ResizeObserver) new ResizeObserver(sync).observe(attr);
  else window.addEventListener("resize", sync);
})();
document.getElementById("q").addEventListener("keydown", ev => { if (ev.key === "Enter") search(); });
document.getElementById("gm").onclick = () => {
  const c = map.getCenter();
  window.open(`https://www.google.com/maps/@${c.lat.toFixed(6)},${c.lng.toFixed(6)},${map.getZoom()}z`, "_blank", "noopener");
};
// 지역 버튼과, 지금 보는 지역의 자료 안내
const regEl = document.getElementById("regions");
for (const r of REGIONS) {
  const b = document.createElement("button");
  b.className = "ghost"; b.textContent = r.meta.name;
  b.onclick = () => map.setView(r.meta.center, r.meta.zoom);
  r.btn = b; regEl.appendChild(b);
}
function syncRegion() {
  const c = map.getCenter(), r = regionAt(c.lat, c.lng);
  for (const x of REGIONS) x.btn.setAttribute("aria-pressed", String(x === r));
  if (!r) { document.getElementById("info").textContent = "지도 범위: " + REGIONS.map(x => x.meta.name).join(" · "); return; }
  try { localStorage.setItem("region", r.meta.id); } catch (e) {}
  const M = r.meta, mix = M.mix || {};
  document.getElementById("info").textContent =
    `${M.name} · 격자 ${M.cell_m}m · ` +
    (M.crime_src ? `시설 ${Math.round((mix.poi || 0) * 100)}% / 범죄 ${Math.round((mix.crime || 0) * 100)}% 반영 · 범죄: ${M.crime_src} 2025년 町丁별 거리 범죄 6종`
                 : "범죄 자료 없음, 시설만 반영") + " · 시설: OpenStreetMap";
}
map.on("moveend", syncRegion); syncRegion();
</script>
</body>
</html>
